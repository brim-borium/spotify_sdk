name: spotify_sdk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel outdated builds for the same branch/PR to save GitHub Actions runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # Linux Job: Handles linting, formatting, analysis, unit tests, and compiles Android & Web
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          setup-java: 'true'
          setup-gradle: 'true'

      - name: Verify Generated Code is Up-to-Date
        run: |
          melos run generate:all
          git diff --exit-code || (echo "Generated files are out of date! Please run 'melos run generate:all' locally and commit changes." && exit 1)

      - name: Format Check
        run: melos run format

      - name: Static Analysis
        run: melos run analyze

      - name: Run Tests with Coverage
        run: melos run test:coverage

      - name: Render Coverage Table & Filter Generated Code
        if: always()
        run: |
          echo "### 📊 Monorepo Code Coverage Report" > coverage_report.md
          echo "" >> coverage_report.md
          echo "*Note: Auto-generated (\`*.g.dart\`) files are excluded from coverage statistics.*" >> coverage_report.md
          echo "" >> coverage_report.md
          echo "| Package | Coverage % | Hit / Total Lines | Status |" >> coverage_report.md
          echo "| :--- | :---: | :---: | :---: |" >> coverage_report.md

          for pkg in packages/spotify_sdk packages/spotify_sdk_platform_interface packages/spotify_sdk_web; do
            lcov_file="$pkg/coverage/lcov.info"
            pkg_name=$(basename "$pkg")
            if [ -f "$lcov_file" ]; then
              # Filter out *.g.dart generated files from lcov report
              awk '/^SF:.*\.g\.dart$/{skip=1} /^end_of_record$/{if(skip){skip=0;next}} !skip' "$lcov_file" > "$lcov_file.tmp" && mv "$lcov_file.tmp" "$lcov_file"

              stats=$(awk -F: '/^LF:/ {lines += $2} /^LH:/ {hit += $2} END {if (lines > 0) printf "%.1f%%|%d/%d", (hit/lines)*100, hit, lines; else print "N/A|0/0"}' "$lcov_file")
              pct=$(echo "$stats" | cut -d'|' -f1)
              counts=$(echo "$stats" | cut -d'|' -f2)
              echo "| \`$pkg_name\` | **$pct** | $counts | ✅ Passed |" >> coverage_report.md
            elif [ "$pkg_name" = "spotify_sdk_web" ]; then
              echo "| \`$pkg_name\` | *Web Suite* | 18 tests | ✅ Passed (Chrome) |" >> coverage_report.md
            else
              echo "| \`$pkg_name\` | *N/A* | - | ⚪ Skipped |" >> coverage_report.md
            fi
          done

          # Output summary directly into GitHub Actions Run Summary tab
          cat coverage_report.md >> $GITHUB_STEP_SUMMARY

      - name: Post Sticky PR Coverage Comment
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: monorepo-coverage
          path: coverage_report.md

      - name: Upload Raw Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: packages/*/coverage/lcov.info

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: packages/*/coverage/lcov.info
          fail_ci_if_error: false

      - name: Run Publish Dry-Run Checks
        run: melos run publish:dry-run

      - name: Build Android Example App
        run: |
          cd packages/spotify_sdk/example
          flutter build apk --debug

      - name: Build Web Example App
        run: |
          cd packages/spotify_sdk/example
          flutter build web

  # macOS Job: Tests iOS compilation (Swift, CocoaPods)
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Prepare iOS Spotify SDK
        run: |
          cd packages/spotify_sdk_ios/ios
          ./prepare-iOS-SDK.sh
          test -d spotify_sdk_ios/ios-sdk/SpotifyiOS.xcframework || (echo "SpotifyiOS.xcframework missing!" && exit 1)

      - name: Build iOS Example App (No Codesign)
        run: |
          cd packages/spotify_sdk/example
          flutter build ios --no-codesign
          flutter build ios --no-codesign --simulator

  # Package Score Job: Verifies pub.dev package compatibility score using pana
  pana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Pana & Webp
        run: |
          flutter pub global activate pana
          sudo apt-get install -y webp

      - name: Verify Monorepo Pub Scores
        run: |
          for pkg in packages/spotify_sdk packages/spotify_sdk_platform_interface packages/spotify_sdk_android packages/spotify_sdk_ios packages/spotify_sdk_web; do
            echo "Verifying Pana score for $pkg..."
            (cd "$pkg" && ../../.github/scripts/verify_pub_score.sh 140)
          done
