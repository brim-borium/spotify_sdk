name: Publish to pub.dev
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*" # tag-pattern on pub.dev: ''

jobs:
  pana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Pana & Webp
        run: |
          flutter pub global activate pana
          sudo apt-get install -y webp

      - name: Verify Monorepo Pub Scores
        run: |
          for pkg in packages/spotify_sdk packages/spotify_sdk_platform_interface packages/spotify_sdk_android packages/spotify_sdk_ios packages/spotify_sdk_web; do
            echo "Verifying Pana score for $pkg..."
            (cd "$pkg" && ../../.github/scripts/verify_pub_score.sh 140)
          done

  publish:
    needs: pana
    environment: 'pub.dev'
    permissions:
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          setup-java: 'true'

      - name: 🪪 Get Id Token
        uses: actions/github-script@v9
        with:
          script: |
            let pub_token = await core.getIDToken('https://pub.dev')
            core.exportVariable('PUB_TOKEN', pub_token)

      - name: 📢 Authenticate pub.dev
        run: flutter pub pub token add https://pub.dev --env-var PUB_TOKEN

      - name: 📢 Publish packages via Melos
        run: melos publish --no-dry-run --yes
