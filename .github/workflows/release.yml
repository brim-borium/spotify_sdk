name: Publish to pub.dev
on:
  push:
    tags:
      - "*-v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          setup-java: 'true'

      - name: Prepare iOS Spotify SDK
        run: |
          cd packages/spotify_sdk_ios/ios
          ./prepare-iOS-SDK.sh

      - name: Verify Publish Dry Run
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *-v* ]]; then
            PKG="${TAG%-v*}"
            melos publish --dry-run --yes --scope="$PKG"
          else
            melos run publish:dry-run
          fi

  publish:
    needs: validate
    environment: 'pub.dev'
    permissions:
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          setup-java: 'true'

      - name: 🪪 Get Id Token
        uses: actions/github-script@v9
        with:
          script: |
            let pub_token = await core.getIDToken('https://pub.dev')
            core.exportVariable('PUB_TOKEN', pub_token)

      - name: 📢 Authenticate pub.dev
        run: flutter pub pub token add https://pub.dev --env-var PUB_TOKEN

      - name: Prepare iOS Spotify SDK
        run: |
          cd packages/spotify_sdk_ios/ios
          ./prepare-iOS-SDK.sh

      - name: 📢 Publish packages via Melos
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *-v* ]]; then
            PKG="${TAG%-v*}"
            melos publish --no-dry-run --yes --scope="$PKG"
          else
            melos publish --no-dry-run --yes
          fi
