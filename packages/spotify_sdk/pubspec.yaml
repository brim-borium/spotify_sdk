name: spotify_sdk
description: A flutter plugin that let's you communicate with the spotify sdk and auth lib
version: 4.0.0-dev.3
homepage: https://github.com/brim-borium/spotify_sdk
repository: https://github.com/brim-borium/spotify_sdk/tree/main/packages/spotify_sdk
issue_tracker: https://github.com/brim-borium/spotify_sdk/issues
topics:
  - spotify
  - audio
  - music
  - playback
  - sdk
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  spotify_sdk_android: ^4.0.0-dev.3
  spotify_sdk_ios: ^4.0.0-dev.3
  spotify_sdk_platform_interface: ^4.0.0-dev.3
  spotify_sdk_web: ^4.0.0-dev.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  plugin:
    platforms:
      android:
        default_package: spotify_sdk_android
      ios:
        default_package: spotify_sdk_ios
      web:
        default_package: spotify_sdk_web
